<section>
  <div id="messagesUserPicker" class="messages-picker-overlay" hidden aria-hidden="true">
    <div class="messages-picker-backdrop" data-close-picker="1" aria-hidden="true"></div>
    <div class="messages-picker-panel card" role="dialog" aria-labelledby="messagesPickerTitle">
      <div class="messages-picker-head">
        <h3 id="messagesPickerTitle">Kullanıcıya mesaj</h3>
        <button type="button" class="messages-picker-close icon-btn" data-close-picker="1" aria-label="Kapat">×</button>
      </div>
      <p class="messages-picker-hint">Departman ve rol bilgisiyle tüm kullanıcılar listelenir; mesajlar paylaşılan veritabanında saklanır.</p>
      <div id="messagesUserPickerList" class="messages-picker-list"></div>
    </div>
  </div>
  <div id="convContextMenu" class="conv-context-menu" hidden role="menu"></div>

  <div class="messages-shell">
    <aside class="messages-left card messages-panel">
      <div class="messages-panel-head">
        <h2>Mesajlar</h2>
        <button class="messages-compose-btn" type="button" title="Kullanıcı seç">✎</button>
      </div>
      <input id="conversationSearch" class="input messages-search" placeholder="Konuşma ara..." />
      <div id="conversationList" class="conversation-list"></div>
    </aside>
    <section id="messagesChatPanel" class="messages-right card messages-chat-card messages-no-thread">
      <header class="messages-chat-header">
        <div class="messages-chat-user">
          <div id="chatUserAvatar" class="chat-user-avatar">?</div>
          <div>
          <div id="chatHeader" class="messages-chat-title">Konuşma Seçiniz</div>
          <div id="chatSubHeader" class="messages-chat-subtitle"></div>
          </div>
        </div>
        <div id="messagesChatActions" class="messages-chat-actions">
          <button class="icon-btn">📹</button>
          <button class="icon-btn">📞</button>
          <button class="icon-btn">🔍</button>
          <span class="messages-actions-divider"></span>
          <button class="icon-btn">⋮</button>
        </div>
      </header>
      <div id="chatStream" class="chat-stream"></div>
      <form id="messageForm" class="messages-input-row">
        <button class="icon-btn" type="button">⊕</button>
        <button class="icon-btn" type="button">☺</button>
        <input id="messageInput" class="input" placeholder="Bir mesaj yazın..." />
        <button class="btn-primary messages-send" type="submit">➤</button>
      </form>
    </section>
  </div>
</section>
