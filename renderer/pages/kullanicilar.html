<section class="users-v2-shell">
  <header class="users-v2-head">
    <div>
      <h1>Kullanıcı Listesi</h1>
      <p>Sistemdeki tüm yönetici, mentor ve stajyerleri buradan yönetebilirsiniz.</p>
    </div>
    <button class="users-v2-add-btn">⊕ Yeni Kullanıcı Ekle</button>
  </header>

  <div class="users-v2-top-row">
    <div id="usersRoleTabs" class="users-v2-tabs">
      <button class="tab-btn active" data-role="ALL">Tümü</button>
      <button class="tab-btn" data-role="MANAGER">Müdür</button>
      <button class="tab-btn" data-role="LEADER">Lider</button>
      <button class="tab-btn" data-role="ADMIN">Personel</button>
      <button class="tab-btn" data-role="STAJYER">Stajyer</button>
      <button class="tab-btn" data-role="DEV">.dev</button>
    </div>
    <div class="users-v2-total-box">
      <span>Toplam Kullanıcı</span>
      <strong id="usersTotalCount">0</strong>
    </div>
  </div>

  <div class="users-v2-table-wrap">
    <table class="users-v2-table">
      <thead>
        <tr>
          <th>AD SOYAD</th>
          <th>E-POSTA</th>
          <th>DEPARTMAN</th>
          <th>ROL</th>
          <th>İŞLEMLER</th>
        </tr>
      </thead>
      <tbody id="usersTableBody"></tbody>
    </table>

    <footer class="users-v2-table-foot">
      <span id="usersRangeInfo">0 kullanıcıdan 0-0 arası gösteriliyor</span>
      <div id="usersPagination" class="users-v2-pagination"></div>
    </footer>
  </div>
</section>
