<section class="tasks-v2-shell">
  <div class="tasks-v2-head">
    <h1 class="tasks-v2-title">Görevlerim</h1>
    <span class="tasks-v2-count-badge"><strong id="taskCount">0</strong> Aktif Görev</span>
  </div>

  <div id="taskSuccessPanel" class="tasks-success-panel hidden"></div>

  <div class="tasks-v2-tabs tabs" id="taskTabs">
    <button class="tab-btn active" data-status="Devam Eden">Devam Eden</button>
    <button class="tab-btn" data-status="Tamamlanan">Tamamlanan</button>
    <button class="tab-btn" data-status="Başarısız">Başarısız Kapatıldı</button>
    <button class="tab-btn" data-status="Ara Verilen">Ara Verilen</button>
    <button class="tab-btn" data-status="İptal Edilen">İptal Edilen</button>
  </div>

  <div id="taskList" class="task-list tasks-v2-list"></div>
</section>
